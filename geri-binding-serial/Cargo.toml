[package]
name = "geri-binding-serial"
description = "Géri v4 message set over serial lines (UART, USB-CDC): COBS framing + CRC-32. Pure, no I/O, no_std."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.85"
keywords = ["telemetry", "protocol", "serial", "cobs", "no-std"]
categories = ["no-std", "embedded", "encoding"]

[features]
crc-no-table = []

[dependencies]
geri-binding-stream.workspace = true
cobs = { version = "0.5", default-features = false, features = ["alloc"] }
crc = "3"
thiserror = { version = "2", default-features = false }

[dev-dependencies]
geri-proto.workspace = true
serde_json = "1"
