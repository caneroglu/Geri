[package]
name = "geri-transport-ws"
description = "WebSocket transport for the Géri source SDK: one connection, hub pushes pace and ring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["telemetry", "websocket", "iot", "transport"]
categories = ["network-programming"]

[dependencies]
geri-adapter-sdk.workspace = true
geri-binding-stream.workspace = true
geri-proto.workspace = true
geri-sign = { workspace = true, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
