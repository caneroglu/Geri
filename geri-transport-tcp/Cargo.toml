[package]
name = "geri-transport-tcp"
description = "Plain TCP transport for the Géri source SDK (length-prefixed frames), optionally inside a Noise channel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["telemetry", "tcp", "noise", "iot", "transport"]
categories = ["network-programming"]

[features]
default = []
noise = ["dep:geri-noise"]

[dependencies]
geri-adapter-sdk.workspace = true
geri-binding-stream.workspace = true
geri-noise = { workspace = true, features = ["tokio"], optional = true }
geri-proto.workspace = true
geri-sign = { workspace = true, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }

[dev-dependencies]
geri-transport-tcp = { path = ".", features = ["noise"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
