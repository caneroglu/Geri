[package]
name = "geri-store-flash"
description = "NOR flash outbox for the Géri source SDK (microcontrollers), built on sequential-storage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["telemetry", "flash", "embedded", "no-std", "outbox"]
categories = ["embedded", "no-std"]

[dependencies]
geri-adapter-sdk.workspace = true
geri-proto = { workspace = true, features = ["cbor"] }
sequential-storage = { version = "8", default-features = false }
embedded-storage = "0.3"
embassy-embedded-hal = { version = "0.6", default-features = false }
embassy-futures = "0.1"
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
