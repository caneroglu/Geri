[package]
name = "geri-transport-reqwest"
description = "HTTP transport for the Géri source SDK, on reqwest (rustls)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["telemetry", "http", "iot", "transport"]
categories = ["network-programming"]

[dependencies]
geri-adapter-sdk.workspace = true
geri-binding-http.workspace = true
geri-proto.workspace = true
geri-sign = { workspace = true, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde_json = "1"
